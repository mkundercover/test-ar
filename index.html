<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Ondulkart AR - Nativa</title>
    <style>
        body, html { margin: 0; width: 100%; height: 100%; overflow: hidden; background: black; }
        #v { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #c { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; }
        #btn { padding: 30px; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="overlay"><button id="btn">AVVIA AR NATIVA</button></div>
    <video id="v" autoplay playsinline></video>
    <canvas id="c"></canvas>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';
        import { GLTFLoader } from 'https://unpkg.com/three@0.158.0/examples/jsm/loaders/GLTFLoader.js';

        let scene, camera, renderer, butterflies = [];

        document.getElementById('btn').onclick = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            document.getElementById('v').srcObject = stream;
            document.getElementById('overlay').style.display = 'none';
            initThree();
        };

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 100);
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            scene.add(new THREE.AmbientLight(0xffffff, 2));

            const loader = new GLTFLoader();
            loader.load('assets/models/animated_butterfly_fucsia.glb', (gltf) => {
                for (let i = 0; i < 50; i++) {
                    const b = gltf.scene.clone();
                    b.scale.set(0.2, 0.2, 0.2);
                    b.position.set((Math.random()-0.5)*20, Math.random()*3 - 1, -Math.random()*10 - 2);
                    scene.add(b);
                    butterflies.push(b);
                }
            });

            function animate() {
                requestAnimationFrame(animate);
                butterflies.forEach(b => {
                    b.position.x -= 0.05;
                    if (b.position.x < -10) b.position.x = 10;
                });
                renderer.render(scene, camera);
            }
            animate();
        }
    </script>
</body>
</html>

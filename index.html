<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Ondulkart AR</title>
    <!-- A-Frame e AR.js per Android -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <!-- model-viewer per iOS -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    
    <style>
      body, html { margin: 0; height: 100%; overflow: hidden; background: black; }
      #ios-view, #android-view { display: none; width: 100%; height: 100%; }
      #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: rgba(0,0,0,0.8); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="overlay">
        <div id="status-msg"><button onclick="startExperience()">Avvia AR</button></div>
        <div id="calibration-msg" class="hidden">Metti il telefono dritto per iniziare</div>
    </div>
    
    <!-- iOS View (Quick Look) -->
    <div id="ios-view">
        <model-viewer src="./assets/models/animated_butterfly_fucsia.glb" ar ar-modes="quick-look" camera-controls style="width:100%; height:100%"></model-viewer>
    </div>
    
    <!-- Android View (A-Frame Swarm) -->
    <div id="android-view">
        <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
          <a-assets>
            <a-asset-item id="butterflyModel" src="./assets/models/animated_butterfly_fucsia.glb"></a-asset-item>
          </a-assets>
          <a-entity id="main-camera" camera wasd-controls look-controls position="0 1.6 0"></a-entity>
          <a-entity id="swarm"></a-entity>
        </a-scene>
    </div>
    
    <script type="module" src="src/main.ts"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Ondulkart AR</title>
    <style>
      body { margin: 0; height: 100vh; overflow: hidden; background: #000; }
      #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; display: flex; align-items: center; justify-content: center; }
      #start-btn { padding: 20px 40px; font-size: 24px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="ui-layer">
        <button id="start-btn">AVVIA AR PURA</button>
    </div>
    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.158.0';
        import { GLTFLoader } from 'https://cdn.skypack.dev/three@0.158.0/examples/jsm/loaders/GLTFLoader.js';
        import { ARButton } from 'https://cdn.skypack.dev/three@0.158.0/examples/jsm/webxr/ARButton.js';

        let scene, camera, renderer, swarm = [];

        document.getElementById('start-btn').addEventListener('click', async () => {
            document.getElementById('ui-layer').style.display = 'none';
            initAR();
        });

        function initAR() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            scene.add(light);

            const loader = new GLTFLoader();
            loader.load('assets/models/animated_butterfly_fucsia.glb', (gltf) => {
                for (let i = 0; i < 50; i++) {
                    const b = gltf.scene.clone();
                    b.position.set((Math.random()-0.5)*28, Math.random()*2+1, -Math.random()*10 - 2);
                    scene.add(b);
                    swarm.push(b);
                }
            });

            renderer.setAnimationLoop((timestamp, frame) => {
                swarm.forEach(b => {
                    b.position.x -= 0.05;
                    if (b.position.x < -14) b.position.x = 14;
                });
                renderer.render(scene, camera);
            });
        }
    </script>
  </body>
</html>

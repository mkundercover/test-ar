<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Ondulkart AR</title>
    <style>
        body, html { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000; display: flex; align-items: center; justify-content: center; }
        #start-btn { padding: 20px 40px; font-size: 24px; cursor: pointer; background: white; border: none; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <button id="start-btn">AVVIA AR</button>
    </div>

    <!-- Script di caricamento sicuro -->
    <script>
        document.getElementById('start-btn').addEventListener('click', function() {
            this.innerText = 'Caricamento...';
            // Carica A-Frame solo quando richiesto
            const script = document.createElement('script');
            script.src = "https://aframe.io/releases/1.4.0/aframe.min.js";
            script.onload = () => {
                const arjs = document.createElement('script');
                arjs.src = "https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js";
                arjs.onload = () => {
                    document.getElementById('ui-layer').style.display = 'none';
                    // Qui inizieremo la scena dopo che gli script sono pronti
                    initScene();
                };
                document.head.appendChild(arjs);
            };
            document.head.appendChild(script);
        });

        function initScene() {
            const scene = document.createElement('a-scene');
            scene.setAttribute('embedded', '');
            scene.setAttribute('arjs', 'sourceType: webcam;');
            document.body.appendChild(scene);
            alert('Scena A-Frame inizializzata');
        }
    </script>
</body>
</html>

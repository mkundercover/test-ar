<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Ondulkart AR</title>
    <!-- Script Classici (niente moduli) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/ARButton.js"></script>
    <style>
        body, html { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #debug { position: absolute; top: 0; left: 0; z-index: 9999; color: lime; font-size: 20px; }
        #start-btn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 20px; z-index: 10000; }
    </style>
</head>
<body>
    <div id="debug">Inizializzazione...</div>
    <button id="start-btn">AVVIA AR</button>

    <script>
        function log(msg) { document.getElementById('debug').innerHTML += '<br>' + msg; }
        
        log("Script caricato");

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        document.body.appendChild(THREE.ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        scene.add(light);

        const loader = new THREE.GLTFLoader();
        loader.load('assets/models/animated_butterfly_fucsia.glb', (gltf) => {
            log("Modello caricato");
            scene.add(gltf.scene);
        }, undefined, (e) => log("Errore loader: " + e.message));

        renderer.setAnimationLoop((time, frame) => {
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>

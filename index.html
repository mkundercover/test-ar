<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Ondulkart AR</title>
    <!-- Librerie -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
        body, html { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        .view-container { display: none; width: 100%; height: 100%; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 99999; background: #000; color: white; display: flex; align-items: center; justify-content: center; }
        #start-btn { padding: 20px 40px; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="overlay">
        <button id="start-btn">AVVIA ESPERIENZA</button>
    </div>
    
    <!-- iOS View (Nativa) -->
    <div id="ios-view" class="view-container">
        <model-viewer src="assets/models/animated_butterfly_fucsia.glb" ar ar-modes="quick-look" camera-controls style="width:100%; height:100%"></model-viewer>
    </div>
    
    <!-- Android View (A-Frame) -->
    <div id="android-view" class="view-container">
        <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
            <a-assets>
                <a-asset-item id="butterflyModel" src="assets/models/animated_butterfly_fucsia.glb"></a-asset-item>
            </a-assets>
            <a-camera></a-camera>
            <a-entity id="swarm"></a-entity>
        </a-scene>
    </div>
    
    <script>
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const overlay = document.getElementById('overlay');

        document.getElementById('start-btn').addEventListener('click', () => {
            overlay.style.display = 'none';
            if (isIOS) {
                document.getElementById('ios-view').style.display = 'block';
            } else {
                document.getElementById('android-view').style.display = 'block';
                // Inizializzazione Sciame Android
                const swarm = document.querySelector('#swarm');
                createSwarm(swarm);
            }
        });

        function createSwarm(swarmContainer) {
          const numButterflies = 50;
          for (let i = 0; i < numButterflies; i++) {
            let butterfly = document.createElement('a-entity');
            butterfly.setAttribute('gltf-model', '#butterflyModel');
            butterfly.setAttribute('animation-mixer', 'clip: Flying');
            butterfly.setAttribute('scale', '0.2 0.2 0.2');
            butterfly.setAttribute('position', `${(Math.random()-0.5)*28} ${Math.random()*3} -5`);
            swarmContainer.appendChild(butterfly);
          }
        }
    </script>
</body>
</html>
